name: Evals

# Solo manual: Actions > Evals > Run workflow. No corre en push ni en schedule.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Modelo de OpenRouter a evaluar (vacío = el por defecto)"
        default: ""
      techniques:
        description: "Técnicas separadas por coma (all, o ej. bm25,ensemble,agent)"
        default: "all"
      workers:
        description: "Casos en paralelo"
        default: "4"

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - run: uv sync

      # No se cachea el modelo de embeddinggemma (~620 MB): medido, `ollama pull` lo baja en ~4 s en el runner
      # (más rápido que restaurar el caché) y de todos modos no reutilizaba los archivos cacheados.
      - name: Ollama + embeddinggemma
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > ollama.log 2>&1 &   # el runner no tiene systemd: lo levantamos a mano
          for i in $(seq 1 30); do curl -sf localhost:11434 >/dev/null && break; sleep 2; done
          curl -sf localhost:11434 >/dev/null || { cat ollama.log; exit 1; }
          ollama pull embeddinggemma

      - name: SearXNG (búsqueda web para multi)
        run: |
          SEARXNG_SECRET=$(openssl rand -hex 32) docker compose up -d
          for i in $(seq 1 30); do curl -sf "localhost:8080/search?q=test&format=json" >/dev/null && break; sleep 2; done

      # El caché se borra si pasan 7 días sin usarlo (límite de GitHub; ampliarlo exige método de pago).
      # Cada corrida lo renueva; si se vence, `make data` vuelve a bajar el libro (~23 MB).
      - name: Caché del libro de cátedra
        uses: actions/cache@v4
        with:
          path: data/DIAZ-tecnologias-analisis-datos-software-libre.pdf
          key: sedici-10915-78652-v1

      - name: Libro de cátedra (SEDICI, CC BY-NC-SA 4.0; no está en el repo)
        run: make data

      # Índice de Chroma: depende del libro, del código de chunking/embeddings, del modelo y de las dependencias.
      # Si cambia cualquiera de esos, la clave cambia y se reconstruye. Con caché, `tabi index` no hace nada.
      - name: Caché del índice de Chroma
        uses: actions/cache@v4
        with:
          path: chroma_db
          key: chroma-embeddinggemma-${{ hashFiles('data/*.pdf', 'src/tabi/index.py', 'src/tabi/config.py', 'uv.lock') }}

      - run: uv run tabi index

      - name: Evals
        env:
          MODEL: ${{ inputs.model }}
          TECHNIQUES: ${{ inputs.techniques }}
          WORKERS: ${{ inputs.workers }}
        run: |
          args=(-w "$WORKERS")
          [ -n "$MODEL" ] && args+=(-m "$MODEL")
          if [ "$TECHNIQUES" != "all" ]; then
            IFS=, read -ra ts <<< "$TECHNIQUES"
            for t in "${ts[@]}"; do args+=(-t "$t"); done
          fi
          uv run python evals/run.py "${args[@]}"   # escribe la tabla en el summary de la corrida

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals-results
          path: |
            evals/results/
            tmp/conversations/
