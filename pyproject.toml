[project]
name = "agentic-tabi-2026"
version = "0.1.0"
description = "TABI QA con Strands Agents + OpenRouter: RAG, agentes y evals"
requires-python = ">=3.14"
dependencies = [
    "strands-agents[openai]",
    "strands-agents-evals",
    "chromadb",
    "ollama",
    "pypdf",
    "rank-bm25",
    "httpx",
    "streamlit",
    "python-dotenv",
]

[project.scripts]
tabi = "tabi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabi"]
